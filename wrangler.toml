name = "hackernewstopbot"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Cron trigger runs every hour to deliver stories to users at their preferred time
# Users can set their preferred delivery time with /time command (default: 9am CET)
[triggers]
crons = ["0 * * * *"]

# KV namespace for storing active user list and statistics
[[kv_namespaces]]
binding = "USERS_KV"
id = "2948231bcf5a4a1fa1d0896d51cf4e9c"

# Environment variables (secrets should be set via: wrangler secret put)
# TELEGRAM_BOT_TOKEN - Your Telegram bot token (required)
# TELEGRAM_WEBHOOK_SECRET - Random secret for webhook validation (required)
# ADMIN_CHAT_ID - Optional: Your Telegram chat ID for accessing /stats command
#                 Get your chat ID by messaging @userinfobot on Telegram
#                 Can be comma-separated for multiple admins (e.g., "123456,789012")
